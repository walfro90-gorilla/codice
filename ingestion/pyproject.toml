[project]
name = "codice-ingestion"
version = "0.1.0"
description = "Códice L1: raw ingestion (fetch, snapshot, parse as separate steps)"
requires-python = ">=3.12"
dependencies = ["codice-contracts @ file:///${PROJECT_ROOT}/../contracts/python"]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["codice_ingestion"]

[tool.hatch.metadata]
allow-direct-references = true
