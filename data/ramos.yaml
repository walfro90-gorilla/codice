# Correspondencia entre ramo presupuestario y nodo de la estructura.
#
# El ramo es la clasificación administrativa con la que el PEF organiza el gasto;
# el nodo es la pieza del Estado que curamos en la Fase 1. Que un ramo
# "corresponda" a un nodo es una AFIRMACIÓN NUESTRA, no un dato de la fuente:
# por eso vive aquí, es explícita y se puede discutir.
#
# node: null es una respuesta válida y frecuente (R6). Hay ramos que no son un
# órgano —son transferencias, deuda o previsiones— y forzarlos a un nodo diría
# algo falso sobre quién ejerce ese dinero.
#
# Fuente de los nombres y claves: PEF publicado por Transparencia Presupuestaria
# (columna ID_RAMO / DESC_RAMO).

