# State-level skeleton, INEGI entities 09-16 (Fase 1).
# Legal basis verified against CPEUM (Últimas Reformas DOF 02-06-2026):
#   Art. 116 fr. I-III (state powers, direct election incl. local judiciary per reform DOF 15-09-2024),
#   Art. 115 fr. I (ayuntamientos, municipio libre), Art. 122 (CDMX nodes, reform DOF 29-01-2016;
#   fr. IV judiciary in its current form since reform DOF 15-09-2024).
# No autoridad edges: federal-state (Art. 40), governor-ayuntamientos (Art. 115 fr. I,
# "no habrá autoridad intermedia"), nor among the three state powers (Art. 116).
# ponytail: local constitutions pending as sources (R6) — noted in every summary.

nodes:
  # ---- 09 Ciudad de México (Art. 122, reform DOF 29-01-2016) ----
  - id: ejecutivo-estatal-09
    node_type: ejecutivo_estatal
    name: Jefatura de Gobierno de la Ciudad de México
    level: estatal
    territory: "09"
    valid_from: 2016-01-29
    summary: >-
      Titular del Poder Ejecutivo de la Ciudad de México, a cargo de la
      administración pública de la entidad; se elige por votación universal,
      libre, secreta y directa. La constitución local está pendiente de
      incorporarse como fuente.
    legal_basis:
      - document: CPEUM
        article: "Art. 122, apartado A, fracción III"
        url: https://www.diputados.gob.mx/LeyesBiblio/pdf/CPEUM.pdf

  - id: congreso-09
    node_type: congreso_local
    name: Congreso de la Ciudad de México
    level: estatal
    territory: "09"
    valid_from: 2016-01-29
    summary: >-
      Depositario del Poder Legislativo de la Ciudad de México; sus integrantes
      se eligen mediante sufragio universal, libre, secreto y directo. La
      constitución local está pendiente de incorporarse como fuente.
    legal_basis:
      - document: CPEUM
        article: "Art. 122, apartado A, fracción II"
        url: https://www.diputados.gob.mx/LeyesBiblio/pdf/CPEUM.pdf

  - id: poder-judicial-09
    node_type: poder_judicial_estatal
    name: Poder Judicial de la Ciudad de México
    level: estatal
    territory: "09"
    # Current form (Tribunal de Disciplina local, elected judiciary) dates from
    # the judicial reform, not the 2016 CDMX reform: "Parrafo reformado DOF 15-09-2024".
    valid_from: 2024-09-15
    summary: >-
      Se deposita en el Tribunal Superior de Justicia, el Tribunal de Disciplina
      Judicial local, el órgano de administración judicial y los juzgados que
      establezca la constitución local; sus magistraturas y judicaturas se
      eligen por voto libre, directo y secreto de la ciudadanía. La constitución
      local está pendiente de incorporarse como fuente.
    legal_basis:
      - document: CPEUM
        article: "Art. 122, apartado A, fracción IV"
        url: https://www.diputados.gob.mx/LeyesBiblio/pdf/CPEUM.pdf

  - id: ayuntamientos-09
    node_type: ayuntamientos
    name: Alcaldías de la Ciudad de México
    level: municipal
    territory: "09"
    valid_from: 2016-01-29
    summary: >-
      Órganos político administrativos a cargo del gobierno de las demarcaciones
      territoriales; se integran por una persona alcaldesa y un concejo electos
      por votación universal, libre, secreta y directa. La constitución local
      está pendiente de incorporarse como fuente.
    legal_basis:
      - document: CPEUM
        article: "Art. 122, apartado A, fracción VI"
        url: https://www.diputados.gob.mx/LeyesBiblio/pdf/CPEUM.pdf

  # ---- 10 Durango ----
  - id: ejecutivo-estatal-10
    node_type: ejecutivo_estatal
    name: Gobernador/a del Estado de Durango
    level: estatal
    territory: "10"
    summary: >-
      Titular del Poder Ejecutivo del estado; se elige de forma directa y su
      mandato no puede exceder seis años. La constitución local está pendiente
      de incorporarse como fuente.
    legal_basis:
      - document: CPEUM
        article: "Art. 116, fracción I"
        url: https://www.diputados.gob.mx/LeyesBiblio/pdf/CPEUM.pdf

  - id: congreso-10
    node_type: congreso_local
    name: Congreso del Estado de Durango
    level: estatal
    territory: "10"
    summary: >-
      Legislatura local integrada por diputaciones electas según los principios
      de mayoría relativa y representación proporcional. La constitución local
      está pendiente de incorporarse como fuente.
    legal_basis:
      - document: CPEUM
        article: "Art. 116, fracción II"
        url: https://www.diputados.gob.mx/LeyesBiblio/pdf/CPEUM.pdf

  - id: poder-judicial-10
    node_type: poder_judicial_estatal
    name: Poder Judicial del Estado de Durango
    level: estatal
    territory: "10"
    summary: >-
      Se ejerce por los tribunales que establece la constitución del estado; sus
      magistraturas y judicaturas se eligen por voto directo y secreto de la
      ciudadanía. La constitución local está pendiente de incorporarse como
      fuente.
    legal_basis:
      - document: CPEUM
        article: "Art. 116, fracción III"
        url: https://www.diputados.gob.mx/LeyesBiblio/pdf/CPEUM.pdf

  - id: ayuntamientos-10
    node_type: ayuntamientos
    name: Ayuntamientos del Estado de Durango
    level: municipal
    territory: "10"
    summary: >-
      Cada municipio es gobernado por un ayuntamiento de elección popular
      directa, sin autoridad intermedia entre este y el gobierno del estado. La
      constitución local está pendiente de incorporarse como fuente.
    legal_basis:
      - document: CPEUM
        article: "Art. 115, fracción I"
        url: https://www.diputados.gob.mx/LeyesBiblio/pdf/CPEUM.pdf

