# Legitimidad edges: ciudadania -> every directly elected body.
# Local judiciaries included: CPEUM Art. 116 fr. III (reform DOF 15-09-2024)
# mandates their election by direct and secret citizen vote; CDMX per Art. 122 A fr. IV.
edges:
  # 09 Ciudad de México (Art. 122)
  - from: ciudadania
    to: ejecutivo-estatal-09
    type: legitimidad
    legal_basis: "CPEUM Art. 122, apartado A, fracción III — votación universal, libre, secreta y directa"
  - from: ciudadania
    to: congreso-09
    type: legitimidad
    legal_basis: "CPEUM Art. 122, apartado A, fracción II — sufragio universal, libre, secreto y directo"
  - from: ciudadania
    to: poder-judicial-09
    type: legitimidad
    legal_basis: "CPEUM Art. 122, apartado A, fracción IV — elección por voto libre, directo y secreto de la ciudadanía"
  - from: ciudadania
    to: ayuntamientos-09
    type: legitimidad
    legal_basis: "CPEUM Art. 122, apartado A, fracción VI, inciso a) — alcalde y concejo electos por votación universal, libre, secreta y directa"

  # 10 Durango
  - from: ciudadania
    to: ejecutivo-estatal-10
    type: legitimidad
    legal_basis: "CPEUM Art. 116, fracción I — elección directa de gobernadores"
  - from: ciudadania
    to: congreso-10
    type: legitimidad
    legal_basis: "CPEUM Art. 116, fracción I — elección directa de las Legislaturas Locales"
  - from: ciudadania
    to: poder-judicial-10
    type: legitimidad
    legal_basis: "CPEUM Art. 116, fracción III — elección por voto directo y secreto de la ciudadanía (reforma DOF 15-09-2024)"
  - from: ciudadania
    to: ayuntamientos-10
    type: legitimidad
    legal_basis: "CPEUM Art. 115, fracción I — ayuntamiento de elección popular directa"

  # 11 Guanajuato
  - from: ciudadania
    to: ejecutivo-estatal-11
