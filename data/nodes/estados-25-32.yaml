# State-level skeleton, INEGI entities 25-32 (Fase 1).
# Structure only: 4 nodes per state (executive, legislature, judiciary, ayuntamientos).
# Legal basis: CPEUM Art. 116 (state powers), Art. 115 (municipio libre) — verified
# against DOF text (últimas reformas 02-06-2026). Each state's constitución local is
# pending as a source (R6); it will refine valid_from and per-organ detail.
# No autoridad edges: federal→state (Art. 40 federal pact), governor→ayuntamientos
# (Art. 115 fr. I: "no habrá autoridad intermedia"), nor among the three state powers.
# legitimidad edges: direct election — governor and legislature (Art. 116 fr. I),
# ayuntamientos (Art. 115 fr. I), local judiciary (Art. 116 fr. III, reforma DOF 15-09-2024:
# "elección por voto directo y secreto de la ciudadanía").

nodes:
  # --- 25 Sinaloa ---
  - id: ejecutivo-estatal-25
    node_type: ejecutivo_estatal
    name: Gobernador/a del Estado de Sinaloa
    level: estatal
    territory: "25"
    summary: >-
      Titular del Poder Ejecutivo del Estado de Sinaloa, de elección directa
      por un periodo máximo de seis años. La constitución local está pendiente de
      incorporarse como fuente.
    legal_basis:
      - document: CPEUM
        article: "Art. 116, fracción I"
        url: https://www.diputados.gob.mx/LeyesBiblio/pdf/CPEUM.pdf

  - id: congreso-25
    node_type: congreso_local
    name: Congreso del Estado de Sinaloa
    level: estatal
    territory: "25"
    summary: >-
      Poder Legislativo del Estado de Sinaloa, integrado por diputaciones de
      elección directa. La constitución local está pendiente de incorporarse como fuente.
    legal_basis:
      - document: CPEUM
        article: "Art. 116, fracción II"
        url: https://www.diputados.gob.mx/LeyesBiblio/pdf/CPEUM.pdf

  - id: poder-judicial-25
    node_type: poder_judicial_estatal
    name: Poder Judicial del Estado de Sinaloa
    level: estatal
    territory: "25"
    summary: >-
      Se ejerce por los tribunales que establece la constitución del estado; sus
      magistraturas y judicaturas se eligen por voto directo conforme a la reforma
      judicial de 2024. La constitución local está pendiente de incorporarse como fuente.
    legal_basis:
      - document: CPEUM
        article: "Art. 116, fracción III"
        url: https://www.diputados.gob.mx/LeyesBiblio/pdf/CPEUM.pdf

  - id: ayuntamientos-25
    node_type: ayuntamientos
    name: Ayuntamientos del Estado de Sinaloa
    level: municipal
    territory: "25"
    summary: >-
      Gobiernos municipales del estado, cada uno encabezado por un ayuntamiento de
      elección popular directa, sin autoridad intermedia con el gobierno estatal.
      La constitución local está pendiente de incorporarse como fuente.
    legal_basis:
      - document: CPEUM
        article: "Art. 115, fracción I"
        url: https://www.diputados.gob.mx/LeyesBiblio/pdf/CPEUM.pdf

