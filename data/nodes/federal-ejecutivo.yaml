# Federal Executive: Presidency, the 22 dependencies of LOAPF Art. 26 (fracc. I-XXII,
# reform DOF 28-11-2024) and the Consejería Jurídica (CPEUM Art. 90 / LOAPF Art. 43).
# Every article below was verified by grep against CPEUM (Reforms through DOF 02-06-2026)
# and LOAPF (last reform DOF 07-05-2026) full texts.
# valid_from = decree date that established the CURRENT denomination, only where the
# per-article reform note was verified; omitted otherwise.
# Includes the extinct Secretaría de la Función Pública (R9: extinct and successor coexist).

