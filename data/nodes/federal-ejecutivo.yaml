        url: https://www.diputados.gob.mx/LeyesBiblio/pdf/CPEUM.pdf
      - document: CPEUM
        article: "Art. 90"
        url: https://www.diputados.gob.mx/LeyesBiblio/pdf/CPEUM.pdf

