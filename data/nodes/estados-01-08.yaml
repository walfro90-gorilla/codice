    to: ejecutivo-estatal-01
    type: legitimidad
    legal_basis: "CPEUM Art. 116, fracción I — elección directa de gobernadores"
  - from: ciudadania
    to: congreso-01
    type: legitimidad
    legal_basis: "CPEUM Art. 116, fracción I — elección directa de las Legislaturas Locales"
  - from: ciudadania
    to: poder-judicial-01
    type: legitimidad
    legal_basis: "CPEUM Art. 116, fracción III — elección por voto directo y secreto de la ciudadanía (reforma DOF 15-09-2024)"
  - from: ciudadania
    to: ayuntamientos-01
    type: legitimidad
    legal_basis: "CPEUM Art. 115, fracción I — ayuntamiento de elección popular directa"

