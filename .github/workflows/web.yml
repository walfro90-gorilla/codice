# Frontend CI: Next.js build when web/ or the TypeScript contract changes.
name: web

on:
  workflow_dispatch: # lets a maintainer re-run the lane on demand
  push:
    paths:
      - "web/**"
      - "contracts/typescript/**"
      - ".github/workflows/web.yml"
  pull_request:
    paths:
      - "web/**"
      - "contracts/typescript/**"
      - ".github/workflows/web.yml"

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 24

      # web depends on @codice/contracts via file:../contracts/typescript, and
      # that package ships types from dist/ — so the contract must be compiled
      # before the app can typecheck against it.
      - name: Build the shared contracts package
        working-directory: contracts/typescript
        run: |
          npm ci
          npm run build

      - name: Install and build web
        working-directory: web
        run: |
          npm ci
          npm run build

      - name: Dataset invariants
        working-directory: web
        run: npm test
