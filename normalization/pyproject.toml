[project]
name = "codice-normalization"
version = "0.1.0"
description = "Códice L2: canonical loading, curated data validation, graph export"
requires-python = ">=3.12"
dependencies = [
  "codice-contracts @ file:///${PROJECT_ROOT}/../contracts/python",
  "pyyaml>=6",
  "psycopg[binary]>=3.1",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["codice_normalization"]

[tool.hatch.metadata]
allow-direct-references = true
